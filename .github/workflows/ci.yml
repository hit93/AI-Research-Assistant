name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install Dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          uv pip install ruff pytest pytest-asyncio

      - name: Run Linter (Ruff)
        run: |
          uv run ruff check .

      - name: Run Test Suite (Offline Unit & Mock Tests)
        run: |
          uv run pytest tests/ -k "not test_arxiv_search and not test_web_search" --tb=short
        env:
          GROQ_API_KEY: "mock_groq_api_key"
          TAVILY_API_KEY: "mock_tavily_api_key"
          SEARCH_ENGINE: "ddg"
