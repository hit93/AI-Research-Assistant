services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-assistant-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - research-net

  # Phase 4: Redis Short-Term Memory & Semantic Cache
  redis:
    image: redis:7-alpine
    container_name: research-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-net

  # Phase 4: PostgreSQL + pgvector Long-Term Memory
  db:
    image: pgvector/pgvector:pg16
    container_name: research-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-research_memory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-research_memory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-net

volumes:
  redis_data:
  pgdata:

networks:
  research-net:
    driver: bridge
